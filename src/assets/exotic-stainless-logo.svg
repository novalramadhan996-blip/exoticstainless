<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Exotic Stainless emblem</title>
  <desc id="desc">Metallic angular X emblem for Exotic Stainless</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.22" stop-color="#7b8188"/>
      <stop offset="0.46" stop-color="#ffffff"/>
      <stop offset="0.68" stop-color="#4b5056"/>
      <stop offset="0.86" stop-color="#e5e7eb"/>
      <stop offset="1" stop-color="#737980"/>
    </linearGradient>
    <linearGradient id="darkSteel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe3e7"/>
      <stop offset="0.5" stop-color="#555b62"/>
      <stop offset="1" stop-color="#bfc4c9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <g filter="url(#shadow)" stroke-linejoin="miter">
    <path d="M170 125 L400 355 L630 125 L555 125 L400 280 L245 125 Z" fill="url(#steel)"/>
    <path d="M150 240 L400 490 L650 240 L610 240 L400 450 L190 240 Z" fill="url(#darkSteel)"/>
    <path d="M350 340 L400 290 L450 340 L400 390 Z" fill="#24272b"/>
    <path d="M170 125 L245 125 L400 280 L400 355 Z" fill="url(#darkSteel)" opacity=".9"/>
    <path d="M630 125 L555 125 L400 280 L400 355 Z" fill="url(#steel)" opacity=".9"/>
    <path d="M355 370 L400 415 L445 370 L505 430 L400 535 L295 430 Z" fill="url(#steel)"/>
    <path d="M305 570 L400 665 L495 570 L455 570 L400 625 L345 570 Z" fill="url(#steel)"/>
  </g>
</svg>
