  <title id="title">Exotic Stainless</title>
  <desc id="desc">Metallic Exotic Stainless logo</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
